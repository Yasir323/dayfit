appId: dev.dayfit.app
productName: Dayfit
directories:
  buildResources: build
# Allowlist: only the built app, its resources and package.json (production
# node_modules are added by electron-builder). Keeps repo internals out of the asar.
files:
  - out/**
  - resources/**
  - package.json
asarUnpack:
  - resources/**
win:
  executableName: Dayfit
  target:
    - nsis
nsis:
  artifactName: ${productName}-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
mac:
  target:
    - dmg
    - zip
  category: public.app-category.productivity
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    LSUIElement: true
    NSCameraUsageDescription: Dayfit uses the camera on your Mac to notice tiredness and posture. Nothing is recorded or sent.
  # Unsigned local build. To sign and notarize, remove `identity: null`, set
  # `notarize: true`, and provide a Developer ID certificate and Apple
  # credentials (see README, "Signing").
  identity: null
  notarize: false
dmg:
  artifactName: ${productName}-${version}.${ext}
linux:
  target:
    - AppImage
    - snap
    - deb
  category: Utility
appImage:
  artifactName: ${productName}-${version}.${ext}
npmRebuild: false
