appId: dev.dayfit.app
productName: Dayfit
directories:
  buildResources: build
# Allowlist: only the built app, its resources and package.json (production
# node_modules are added by electron-builder). Keeps repo internals out of the asar.
files:
  - out/**
  - resources/**
  - package.json
asarUnpack:
  - resources/**
win:
  executableName: Dayfit
  icon: build/icon.ico
  target:
    - target: nsis
      arch:
        - x64
nsis:
  artifactName: ${productName}-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
mac:
  icon: build/icon.icns
  # Used by the zip; the dmg sets its own name below.
  artifactName: ${productName}-${version}-${arch}-mac.${ext}
  target:
    - target: dmg
      arch:
        - arm64
        - x64
    - target: zip
      arch:
        - arm64
        - x64
  category: public.app-category.productivity
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    LSUIElement: true
    NSCameraUsageDescription: Dayfit uses the camera on your Mac to notice tiredness and posture. Nothing is recorded or sent.
  # Ad-hoc signed ("-"): free, seals the bundle so a downloaded copy is not
  # reported as "damaged" on Apple silicon, but it is not trusted by Gatekeeper.
  # Hardened runtime is off because an ad-hoc signed app with it on fails to
  # launch (library validation). To sign and notarize, remove `identity` and
  # `hardenedRuntime`, set `notarize: true`, and provide a Developer ID
  # certificate and Apple credentials (see README, "Signing").
  identity: '-'
  hardenedRuntime: false
  notarize: false
dmg:
  artifactName: ${productName}-${version}-${arch}.${ext}
linux:
  target:
    - AppImage
    - snap
    - deb
  category: Utility
appImage:
  artifactName: ${productName}-${version}.${ext}
npmRebuild: false
